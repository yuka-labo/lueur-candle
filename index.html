<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Lueur — 世界の愛の詩を灯すキャンドルアプリ">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
  
  <title>Lueur — 世界の愛の詩を灯す</title>
</head>
<body>
  <div id="app">
    <!-- 背景 -->
    <div id="background" class="background"></div>
    
    <!-- メインコンテンツ -->
    <div class="container">
      <!-- メッセージ表示エリア -->
      <div id="message-area" class="message-area">
        <p id="message-text" class="message-text"></p>
        <span id="author-label" class="author-label hidden"></span>
      </div>
      
      <!-- キャンドル -->
      <div class="candle-wrapper">
        <div class="candle">
          <div class="flame-wrapper">
            <div id="flame" class="flame"></div>
            <div class="flame-glow"></div>
          </div>
          <div class="wick"></div>
          <div class="wax"></div>
          <div class="wax-drip"></div>
        </div>
        <div class="candle-light"></div>
      </div>
      
      <!-- 操作ガイド -->
      <div id="guide" class="guide">
        <p>息を吹きかけてみて</p>
      </div>
      
      <!-- マイク許可ボタン -->
      <button id="mic-button" class="mic-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <span>タップして始める</span>
      </button>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="messages.js"></script>
  <script src="collection.js"></script>
  <script src="app.js"></script>
</body>
</html>
